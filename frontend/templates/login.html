<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | ResumeRanker</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/resumera.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ✅ Navbar -->
  <div class="nav_bar">
    <div class="t-img-logo">
      <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo">
      <div class="brand-title">
        <span class="main-title">ResumeRanker</span><br>
        <span class="slogan">Rank Refine Redefine</span>
      </div>
    </div>

    <div class="features">
      <a href="{{ url_for('home') }}">Home</a>
      <a href="{{ url_for('about') }}">About</a>
      <a href="{{ url_for('contact') }}">Contact</a>
    </div>
  </div>

  <!-- ✅ Login Section -->
  <div class="login-container">
    <div class="login-box">
      <h1>Login</h1>

      <form method="POST" action="{{ url_for('login') }}">
        <label for="username">Email or Phone Number</label>
        <input type="text" id="username" name="username" placeholder="Enter your email or phone number" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required>

        <button type="submit">Login</button>
      </form>

              <p style="color: red; text-align:center; margin-top: 12px; font-weight:500;">{{ message }}</p>
      <p class="signup-link">
        Don’t have an account? <a href="{{ url_for('signup') }}">Sign Up</a>
      </p>

      <a href="{{ url_for('home') }}" class="back">⬅ Back to Home</a>
    </div>
  </div>

</body>
</html>
